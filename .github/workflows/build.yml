name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 client
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Install SPIR-V optimizer
        uses: msys2/setup-msys2@v2
        id: spirv-tools
        with:
          release: false
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-spirv-tools

      - name: Build portable client
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.spirv-tools.outputs.msys2-location }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DSERVER=OFF -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DPREFER_BUNDLED_LIBS=ON `
            -DVULKAN=ON -DVIDEORECORDER=OFF `
            "-DSPIRV_OPTIMIZER_PROGRAM=$env:MSYS2_ROOT/ucrt64/bin/spirv-opt.exe"
          cmake --build build --target game-client --parallel
          cmake --install build --prefix "$PWD/artifact" --component portable

      - uses: actions/upload-artifact@v6
        with:
          name: DDNet-Windows-x64-Vulkan
          path: artifact/
          if-no-files-found: error
          compression-level: 1
